<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="logo-check" aria-hidden="true">&#10003;</span>
      <h1>Task Tracker</h1>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <!-- 1.1 Add task -->
      <h2 class="section-title">Add a New Task</h2>
      <form id="task-form" class="add-form" novalidate>
        <input
          type="text"
          id="task-input"
          placeholder="Enter a task..."
          aria-label="Task description"
          autocomplete="off"
          maxlength="200"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <p id="error-msg" class="error-msg" role="alert" hidden>Please enter a task before adding.</p>

      <!-- 1.2 Stats -->
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="total-count">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Completed</span>
          <span class="stat-value green" id="completed-count">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pending</span>
          <span class="stat-value orange" id="pending-count">0</span>
        </div>
      </div>

      <!-- 1.3 Filter -->
      <div class="filter-row">
        <div class="filters" role="group" aria-label="Filter tasks">
          <span class="filter-label">Filter by:</span>
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <span class="autosave">&#9729; Auto-saving enabled</span>
      </div>

      <div class="view-banner" id="view-banner">Current View: All Tasks</div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-msg" class="empty-msg" hidden>No tasks to show.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
